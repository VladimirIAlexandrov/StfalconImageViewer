plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish' // Добавляем плагин, чтобы JitPack смог опубликовать артефакт
}

android {
    compileSdk 36

    defaultConfig {
        minSdkVersion 25
        targetSdkVersion 36
    }
    
    namespace 'com.stfalcon.imageviewer'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'androidx.transition:transition:1.6.0'
    implementation 'com.github.chrisbanes:PhotoView:2.2.0'
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

// Этот блок критически важен — он объясняет JitPack, как собрать .aar файл
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'stfalcon-imageviewer'
                version = '1.0.0'
            }
        }
    }
}

// Избегаем ошибок при сборке документации на сервере JitPack
tasks.withType(Javadoc) {
    enabled = false
}
